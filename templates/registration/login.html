{% extends 'base.html' %}

{% block content %}

<div class="register-container">

    <h1>Login Form</h1>

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Login</button>
    </form>

    <p>
        Dont have a account?
        <a href="{% url 'register' %}">Register</a>
    </p>

</div>

{% endblock %}
