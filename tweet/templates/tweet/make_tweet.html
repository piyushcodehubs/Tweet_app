{% extends 'base.html' %}

{% block title %}Create Tweet | Tweet App{% endblock %}

{% endblock %}

{% block content %}

<div class="create-container">

    <div class="create-card">

        <h2>
            {% if form.instance.pk %}
            Edit TWeet

            {% endif %}

{% endblock %}
